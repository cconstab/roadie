# Builds the downloads when a release is published, and attaches them to it.
# Parked here until the owner's gh sign-in may push workflow files; then:
#   git mv docs/release.yml .github/workflows/release.yml
name: release downloads

on:
  release:
    types: [published]

permissions:
  contents: write   # to attach files to the release, nothing else

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # One machine builds every system's download; see scripts/package.mjs.
      - run: node scripts/package.mjs
        env:
          ROADIE_RELEASE: ${{ github.event.release.tag_name }}
      - run: gh release upload "$TAG" dist/roadie-*.tar.gz dist/roadie-*.zip dist/install.sh dist/install.ps1 dist/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
